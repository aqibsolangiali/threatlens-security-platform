<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">ThreatLens risk score bands</title><desc id="desc">A score of 0 to 24 means fewer indicators, 25 to 49 means use caution, and 50 to 100 means higher concern. The score is only a heuristic.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a2b"/><stop offset="1" stop-color="#1a2b49"/></linearGradient></defs>
<rect width="1200" height="300" rx="26" fill="url(#bg)"/><text x="54" y="55" fill="#9ab2ff" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">HOW TO READ THE SCORE</text>
<rect x="54" y="91" width="344" height="130" rx="18" fill="#102f35" stroke="#3cbf9b" stroke-width="1.5"/><circle cx="91" cy="131" r="8" fill="#3cbf9b"/><text x="115" y="139" fill="#e6fff7" font-family="Arial,sans-serif" font-size="29" font-weight="700">0–24</text><text x="82" y="178" fill="#d3e9e5" font-family="Arial,sans-serif" font-size="17" font-weight="700">Fewer risk indicators</text><text x="82" y="202" fill="#a9c5bf" font-family="Arial,sans-serif" font-size="14">A low score is not proof of safety.</text>
<rect x="428" y="91" width="344" height="130" rx="18" fill="#382a19" stroke="#e6a13d" stroke-width="1.5"/><circle cx="465" cy="131" r="8" fill="#e6a13d"/><text x="489" y="139" fill="#fff4df" font-family="Arial,sans-serif" font-size="29" font-weight="700">25–49</text><text x="456" y="178" fill="#f4e6ce" font-family="Arial,sans-serif" font-size="17" font-weight="700">Use caution</text><text x="456" y="202" fill="#c9b99f" font-family="Arial,sans-serif" font-size="14">Review each finding and verify the link.</text>
<rect x="802" y="91" width="344" height="130" rx="18" fill="#3c222c" stroke="#ea7182" stroke-width="1.5"/><circle cx="839" cy="131" r="8" fill="#ea7182"/><text x="863" y="139" fill="#fff0f2" font-family="Arial,sans-serif" font-size="29" font-weight="700">50–100</text><text x="830" y="178" fill="#f6dfe3" font-family="Arial,sans-serif" font-size="17" font-weight="700">Higher concern</text><text x="830" y="202" fill="#ceb0b6" font-family="Arial,sans-serif" font-size="14">Pause and verify before interacting.</text>
<text x="54" y="263" fill="#aab7cc" font-family="Arial,sans-serif" font-size="14">ThreatLens adds documented heuristic points, caps the result at 100, and lists the signals that contributed.</text>
</svg>
